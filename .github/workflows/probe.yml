name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p runlogs
          { curl -s -m 20 https://nfs.faireconomy.media/ff_calendar_thisweek.json -o ff.json -w "%{http_code}\n"
          python3 -c "
          import json;d=json.load(open('ff.json'));print(len(d))
          for x in d:
              if x['impact']=='High': print(x['date'],x['country'],x['title'])
          "; } > runlogs/probe.txt 2>&1
          git config user.name mrmarketcap; git config user.email noreply@anthropic.com
          git add runlogs/probe.txt; git commit -qm "probe out" ; git push
