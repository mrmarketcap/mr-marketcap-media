name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p runlogs
          {
          for s in CUSR0000SA0 CUUR0000SA0 CES0000000001 LNS14000000; do
            curl -s -m 25 "https://api.bls.gov/publicAPI/v1/timeseries/data/$s" -o b.json -w "$s %{http_code}\n"
            python3 -c "
          import json;d=json.load(open('b.json'));print(d.get('status'),d.get('message'));r=d['Results']['series'][0]['data'][:4];print([(x['year'],x['period'],x['value'],x.get('latest')) for x in r])"
          done
          curl -s -m 20 https://nfs.faireconomy.media/ff_calendar_thisweek.json | python3 -c "
          import json,sys;d=json.load(sys.stdin);print([x for x in d if 'CPI' in x['title'] or 'Non-Farm' in x['title']][:6])"
          } > runlogs/probe.txt 2>&1
          git config user.name mrmarketcap; git config user.email noreply@anthropic.com
          git add runlogs/probe.txt; git commit -qm "probe out"; git push
