name: live-prices
on:
  workflow_dispatch:
    inputs:
      coins:
        description: "Space-separated tickers (KuCoin USDT pairs)"
        default: "BTC ETH"
permissions:
  contents: write
concurrency:
  group: live-prices
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/live_prices.py ${{ github.event.inputs.coins }}
      - run: |
          git config user.name "mrmarketcap"; git config user.email "noreply@anthropic.com"
          git add data/live-prices.json
          git commit -qm "Live prices" || exit 0
          git pull -q --rebase origin main; git push -q origin HEAD:main
