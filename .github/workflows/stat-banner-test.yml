name: stat-banner-test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          (which google-chrome >/dev/null 2>&1 || timeout 300 python -m playwright install --with-deps chromium)
          mkdir -p alerts/test
          python tools/stat_banner.py ETH '$2,314' '30-day low' down alerts/test/stat-test.jpg
      - run: |
          git config user.name "mrmarketcap"
          git config user.email "noreply@anthropic.com"
          git add alerts/test
          git commit -m "stat banner test render"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
