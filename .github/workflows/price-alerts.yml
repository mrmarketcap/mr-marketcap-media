name: price-alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test banner and delete it"
        default: "false"
permissions:
  contents: write
concurrency:
  group: price-alerts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test send (manual only)
        if: ${{ github.event.inputs.test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium
          python tools/price_alerts.py test
      - name: Detect round-level crossings
        if: ${{ github.event.inputs.test != 'true' }}
        run: python tools/price_alerts.py detect
      - name: Install renderer (only when there is an alert)
        if: ${{ hashFiles('pending.json') != '' }}
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Render and send
        if: ${{ hashFiles('pending.json') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/price_alerts.py send
      - name: Save state
        if: ${{ always() && hashFiles('pending.json') == '' }}
        run: |
          git config user.name "mrmarketcap"
          git config user.email "noreply@anthropic.com"
          git add price-alerts-state.json alerts || true
          git diff --cached --quiet || (git commit -m "Price alert state" && git pull --rebase -q && git push -q)
