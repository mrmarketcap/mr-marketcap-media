name: market-alerts
on:
  schedule:
    - cron: "5 6 * * *"          # daily Fear & Greed (06:05 UTC = 10:05 Tbilisi)
    - cron: "5 9 * * *"          # retry later the same day if the first try had no data yet
    - cron: "3 14 * * *"         # daily market summary (14:03 UTC)
    - cron: "3 15 * * 5"         # weekly recap (Friday 15:03 UTC)
    - cron: "5 7 * * 1"          # weekly BTC poll (Monday 07:05 UTC)
    - cron: "7,22,37,52 * * * *" # big 1-hour moves + price records
  workflow_dispatch:
    inputs:
      mode:
        description: "any of: fng movers records summary weekly poll (space separated)"
        default: "movers"
      dry:
        description: "true = print only, do not post"
        default: "true"
permissions:
  contents: write
concurrency:
  group: market-alerts
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '3 15 * * 5' && 'weekly' || github.event.schedule == '5 7 * * 1' && 'poll' || github.event.schedule == '3 14 * * *' && 'summary' || ((github.event.schedule == '5 6 * * *' || github.event.schedule == '5 9 * * *') && 'fng' || 'movers records')) }}
      DRYFLAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check what would be posted
        run: |
          for m in $MODE; do DRY_RUN=1 python tools/market_alerts.py "$m" 2>&1 | tee -a out.txt; done
          if [ "$DRYFLAG" = "true" ]; then mkdir -p runlogs; cp out.txt "runlogs/market-$(date -u +%H%M%S).txt"; fi
      - name: Install renderer (only when there is something to post)
        if: ${{ env.DRYFLAG != 'true' && hashFiles('out.txt') != '' }}
        run: |
          if grep -q '@Mr_marketcap' out.txt; then
            pip install playwright requests
            python -m playwright install --with-deps chromium
            echo POST=1 >> "$GITHUB_ENV"
          fi
      - name: Post
        if: ${{ env.POST == '1' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: for m in $MODE; do python tools/market_alerts.py "$m"; done
      - name: Save state
        if: ${{ always() }}
        run: |
          rm -f out.txt
          git config user.name "mrmarketcap"
          git config user.email "noreply@anthropic.com"
          for f in market-state.json alerts runlogs; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || git commit -m "Market alert state"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
